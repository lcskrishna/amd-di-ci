name: DI Collect and Publish

# Collects the AMD distributed-inference pipeline
# (buildkite.com/vllm/amd-distributed-inference-ci) into data/vllm/di/, then
# publishes the standalone grid to Pages.
#
# Collection and publication are one job on purpose: split across two
# workflows the page can serve data the repo no longer has, and the failure
# mode is silent.
#
# Every three hours is already generous — the steps are 120-minute jobs on a
# scarce MI350 allocation, so the pipeline produces at most a handful of
# builds a day.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to fetch'
        required: false
        # The window only governs collection. jobs.jsonl is never pruned and
        # the grid renders all of it, so a short window still draws the full
        # history — it just stops re-walking builds that already settled.
        default: '4'
      no_logs:
        description: 'Skip job logs (loses the SLURM phase/reason verdict)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '23 */3 * * *'
  # Renderer changes must reach the site without waiting for the next tick.
  # The paths filter is also the loop guard: this job pushes its own commits
  # to this branch, but those only ever touch data/vllm/di/, which is not
  # listed here, so a collection run cannot retrigger itself.
  push:
    branches: [di]
    paths:
      - 'docs/di.html'
      - 'docs/assets/js/ci-di.js'
      - 'docs/assets/css/dashboard.css'
      - 'docs/assets/js/utils.js'
      - 'scripts/build_di_site.py'
      - '.github/workflows/di-collect.yml'

# Buildkite allows 50 requests/minute per authenticated user, and every
# workflow here shares one token. Runners are separate VMs with nothing to
# coordinate through, so the ceiling is divided up statically instead:
# hourly-master 20 + di-collect 15 + queue-monitor 8 + queue-lifecycle 5 = 48.
env:
  BUILDKITE_MAX_RPM: '15'

concurrency:
  group: di-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Collect DI data
        run: |
          ARGS="--days ${{ github.event.inputs.days || '4' }}"
          if [ "${{ github.event.inputs.no_logs }}" = "true" ]; then
            ARGS="$ARGS --no-logs"
          fi
          python scripts/collect_di_ci.py $ARGS --output data/vllm/di/
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/vllm/di/ only. Upstream commits data/vllm/ci/ every ~90
          # minutes; keeping the two paths disjoint is what makes rebasing
          # onto upstream/main stay trivial.
          git add data/vllm/di/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "di: update distributed-inference CI data $(date -u +%Y-%m-%d)"
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push || echo "::warning::Push failed (branch protection?)."
            else
              git rebase --abort || true
              echo "::warning::Rebase failed; no data was published."
            fi
          fi

      # Runs even when the commit was a no-op: a change to the renderer with no
      # new builds still needs to reach the site.
      - name: Build DI site
        run: python scripts/build_di_site.py --output _site_di

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_di
          publish_branch: gh-pages
          # force_orphan keeps gh-pages a single commit rather than accruing
          # one per three-hour run forever.
          keep_files: false
          force_orphan: true
