name: Queue Monitor (10 minute)

on:
  schedule:
    # Keep queue history independent from the large dashboard build. GitHub
    # cron can be delayed, so use six off-minute opportunities per hour.
    - cron: '2,12,22,32,42,52 * * * *'
  repository_dispatch:
    types: [buildkite_queue_changed]
  workflow_dispatch:

# Share of the 50 req/min Buildkite allows per authenticated user; see
# di-collect.yml for the full split. This one polls six times an hour, so it
# will regularly overlap the heavier collectors.
env:
  BUILDKITE_MAX_RPM: '8'

concurrency:
  # Queue evidence has a dedicated branch, so it can keep polling while the
  # much larger dashboard workflow holds the gh-pages deployment lock.
  group: queue-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Sync durable queue history
        run: |
          # queue-data is the independent source of truth. Keep the current
          # gh-pages copy only as a first-run migration source. A transport
          # failure while an established branch exists must fail closed; a
          # stale fallback followed by an orphan force-push would lose history.
          set +e
          git ls-remote --exit-code origin refs/heads/queue-data >/dev/null 2>&1
          QUEUE_DATA_STATUS=$?
          set -e
          if [ "$QUEUE_DATA_STATUS" -eq 0 ]; then
            git fetch origin \
              +refs/heads/queue-data:refs/remotes/origin/queue-data \
              --depth=1
            python scripts/vllm/collect_queue_snapshot.py --merge-history-git-ref origin/queue-data
          elif [ "$QUEUE_DATA_STATUS" -eq 2 ]; then
            git fetch origin \
              +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
              --depth=1 || true
            if git rev-parse --verify --quiet origin/gh-pages >/dev/null; then
              python scripts/vllm/collect_queue_snapshot.py --merge-history-git-ref origin/gh-pages
            fi
          else
            echo "::error::Could not determine durable queue-data branch state; refusing to publish."
            exit "$QUEUE_DATA_STATUS"
          fi

      - name: Prune queue history to post-fix baseline
        run: python scripts/vllm/collect_queue_snapshot.py --prune-only

      - name: Collect queue snapshot
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
        run: |
          echo "Before: $(wc -l < data/vllm/ci/queue_timeseries.jsonl) lines"
          python scripts/vllm/collect_queue_snapshot.py
          echo "After: $(wc -l < data/vllm/ci/queue_timeseries.jsonl) lines"
          tail -1 data/vllm/ci/queue_timeseries.jsonl | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Latest: ts={d[\"ts\"]}, queues={len(d[\"queues\"])}')"

      - name: Build live queue section
        run: python scripts/vllm/build_queue_section.py

      - name: Publish durable live queue evidence
        run: |
          # Publish only queue-owned files on a dedicated single-commit branch.
          # Canonical gh-pages rebuilds can no longer overwrite or delay polls.
          LIVE_ROOT=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$LIVE_ROOT" 2>/dev/null || true
            rm -rf "$LIVE_ROOT"
          }
          trap cleanup EXIT
          git worktree add --detach "$LIVE_ROOT" HEAD
          git -C "$LIVE_ROOT" switch --orphan queue-data-publish
          git -C "$LIVE_ROOT" rm -rf --ignore-unmatch .
          install -D -m 0644 data/vllm/ci/queue_timeseries.jsonl "$LIVE_ROOT/data/vllm/ci/queue_timeseries.jsonl"
          install -D -m 0644 data/vllm/ci/queue_jobs.json "$LIVE_ROOT/data/vllm/ci/queue_jobs.json"
          install -D -m 0644 data/vllm/ci/queue_history_chart.json "$LIVE_ROOT/data/vllm/ci/queue_history_chart.json"
          install -D -m 0644 data/vllm/ci/operations_v2/queue.json "$LIVE_ROOT/data/vllm/ci/operations_v2/queue.json"
          git -C "$LIVE_ROOT" config user.name "github-actions[bot]"
          git -C "$LIVE_ROOT" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$LIVE_ROOT" add \
            data/vllm/ci/queue_timeseries.jsonl \
            data/vllm/ci/queue_jobs.json \
            data/vllm/ci/queue_history_chart.json \
            data/vllm/ci/operations_v2/queue.json
          git -C "$LIVE_ROOT" commit -m "queue: live snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git -C "$LIVE_ROOT" push --force origin HEAD:queue-data
